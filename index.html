<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Soeuringue</title>
<meta name="theme-color" content="#EAF4FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Soeuringue">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#EEF5FA; --card:#FFFFFF; --ink:#1B3550; --muted:#566A7D; --line:#DCE6EE;
  --accent:#2C6A9A; --accent-ink:#FFFFFF; --accent-soft:#E2EEF7;
  --green:#2F8A7E; --green-soft:#E3F3EF;
  --warn:#9A4508; --warn-soft:#FDF0E4; --ok:#1E6B3A; --ok-soft:#E5F3EA;
  --danger:#B42318;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;width:100%;max-width:100%;overscroll-behavior-x:none;margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:16px}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
body{touch-action:pan-y}
.wrap{overflow-x:clip}
a{color:var(--accent)}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 24px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;min-height:44px}
.top h1{font-size:24px;font-weight:800;letter-spacing:-.4px;margin:0}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:34px;height:34px;border-radius:9px}
.back{display:inline-flex;align-items:center;min-height:44px;font-weight:700;text-decoration:none;color:var(--accent);background:none;border:0;padding:0;cursor:pointer}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px}
.hero{background:var(--accent);color:#fff;border-radius:22px;padding:20px;margin-bottom:16px}
.hero .lbl{font-size:14px;font-weight:600;opacity:.92}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-1px;margin:4px 0}
.hero .sub{font-size:13px;opacity:.92}
.hero .row{margin-top:10px;border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.hero .row.soft{background:rgba(255,255,255,.16)}
.hero button.row{width:100%;border:0;color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer;text-align:left;min-height:44px;align-items:center}
.hero button.row:active{background:rgba(255,255,255,.28)}
#splash{flex-direction:column;gap:18px}
#splash .hello{opacity:0;transform:translateY(8px);animation:hello .5s .25s ease forwards;text-align:center;color:#1B3550;padding:0 24px}
#splash .hello b{display:block;font-size:26px;font-weight:800;letter-spacing:-.3px}
#splash .hello span{display:block;font-size:17px;font-weight:600;color:#3D5A73;margin-top:4px}
@keyframes hello{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash .hello{animation:none;opacity:1;transform:none}}
.hero .row.white{background:#fff;color:var(--warn)}
.hero .row.white.ok{color:var(--ok)}
.section{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:18px 4px 8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:12px;color:var(--muted)}
.grid3 b{display:block;font-size:15px;color:var(--ink);margin-top:2px}
.rowx{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:10px;white-space:nowrap}
.pill.warn{color:var(--warn);background:var(--warn-soft)}
.pill.ok{color:var(--ok);background:var(--ok-soft)}
.pill.info{color:var(--accent);background:var(--accent-soft)}
.list{background:var(--card);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;min-height:56px;background:none;width:100%;text-align:left;border-left:0;border-right:0;border-top:0;cursor:pointer}
.item:last-child{border-bottom:0}
.item .t{font-weight:700}
.item .s{font-size:13px;color:var(--muted);margin-top:3px}
.item .v{font-weight:800;white-space:nowrap}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border:0;border-radius:16px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;padding:0 16px}
.btn.accent{background:var(--accent)}
.btn.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}
.btn.danger{background:#fff;color:var(--danger);border:1.5px solid #F2C9C5}
.btn.small{min-height:44px;font-size:15px;width:auto}
.btns{display:flex;gap:10px;margin:12px 0}
.btns .btn{flex:1}
label.f{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px}
.in, select.in, textarea.in{width:100%;min-height:48px;border:1px solid #CFDAE3;border-radius:14px;padding:10px 14px;background:#fff;font-size:16px}
textarea.in{min-height:96px;resize:vertical}
.chk{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border-radius:14px;padding:12px 14px;margin-top:10px;min-height:52px}
.chk input{width:24px;height:24px;accent-color:var(--accent);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border:1px solid #CFDAE3;border-radius:22px;background:#fff;font-size:15px;font-weight:600;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.act{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:8px 8px 8px 14px;margin-bottom:8px}
.act .n{flex:1;font-weight:600;font-size:15px}
.act .c{font-size:13px;color:var(--muted);white-space:nowrap}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:var(--bg);font-size:20px;font-weight:700;cursor:pointer;color:var(--ink);flex:none}
.qty{display:flex;align-items:center;gap:2px}
.qty span{min-width:22px;text-align:center;font-weight:700}
.cot{background:var(--green-soft);border-radius:var(--r);padding:14px 16px;margin-top:14px}
.cot .h{font-size:13px;font-weight:700;color:#1F5F56;margin-bottom:6px}
.line{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0}
.line .d{color:var(--muted);font-size:12px}
.line.tot{border-top:1px solid rgba(0,0,0,.08);margin-top:6px;padding-top:9px;font-weight:800;font-size:16px}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:7px;margin-left:6px}
.tag.Entier{background:var(--accent-soft);color:var(--accent)}
.tag.Demi{background:var(--warn-soft);color:var(--warn)}
.tag.Gratuit,.tag.Inclus{background:#EEF1F4;color:var(--muted)}
.unknown{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:10px 14px;font-size:14px;margin:8px 0}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.empty{text-align:center;padding:30px 10px}
.empty img{width:180px;max-width:60%;border-radius:24px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:8px}
.days .chip{padding:0;min-height:44px}
.sugg{background:#fff;border-radius:14px;margin-top:6px;overflow:hidden;border:1px solid var(--line)}
.sugg button{display:block;width:100%;text-align:left;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:#fff;min-height:44px;cursor:pointer}
.sugg button:last-child{border-bottom:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;font-size:11px;font-weight:700;color:var(--muted);text-decoration:none}
nav.tabs a.on{color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(15,30,45,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h2{margin:0 0 6px;font-size:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;z-index:30;max-width:90%;text-align:center}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:12px;line-height:1.45}
table.det{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
table.det th,table.det td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.det th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
table.det td.m,table.det th.m{text-align:right;white-space:nowrap}
.tablewrap{overflow-x:auto;border-radius:var(--r);background:#fff;margin-bottom:12px}
.print-only{display:none}
.plan{background:#fff;border-radius:20px;padding:8px 6px 6px;height:calc(100vh - 84px - env(safe-area-inset-bottom) - env(safe-area-inset-top) - 150px);min-height:380px;display:flex;flex-direction:column}
.plan-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding-bottom:4px}
.plan-head .we{color:#9AA7B4}
.plan-grid{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line)}
.plan-day{border:0;border-bottom:1px solid var(--line);background:none;padding:3px 2px 2px;display:flex;flex-direction:column;align-items:stretch;gap:2px;min-width:0;overflow:hidden;cursor:pointer;font:inherit;color:var(--ink)}
.plan-day.we{background:#F6F8FA}
.plan-day .num{font-size:15px;font-weight:600;text-align:center;line-height:22px;border-radius:11px;width:24px;height:22px;align-self:center}
.plan-day.today .num{background:var(--ink);color:#fff}
.plan-day.out{opacity:.35}
.plan-day .bar{display:block;color:#fff;font-size:11px;font-weight:700;border-radius:5px;padding:2px 3px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan-day .ev{display:flex;align-items:center;gap:2px;font-size:10px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.plan-day .ev i{flex:none;width:5px;height:5px;border-radius:3px;background:#8896A5}
.plan-day .ev.more{color:var(--muted);font-weight:700}
.wd{min-height:42px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:15px;font-weight:600;cursor:pointer;color:var(--ink)}
.wd.on{color:#fff}
.wd.out{opacity:.35}
.wd.rs{outline:3px solid var(--accent);outline-offset:1px}
.colsw{width:40px;height:40px;border-radius:20px;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.colsw.on{box-shadow:0 0 0 3px var(--ink)}
.tr{border-radius:10px;padding:6px 10px;margin-top:6px;font-size:13px;line-height:1.35;color:var(--ink)}
.tr.r{background:#FDF3D6}
.tr.g{background:#E2F4E8}
.chip.tr-chip-r.on{background:#B7791F;border-color:#B7791F}
.chip.tr-chip-g.on{background:#2F855A;border-color:#2F855A}
#splash{position:fixed;inset:0;z-index:100;background:#E4F5FC;display:flex;align-items:center;justify-content:center;transition:opacity .35s ease}
#splash img{width:min(78vw,380px);height:auto}
#splash.out{opacity:0;pointer-events:none}
@media print{#splash{display:none}}
.g2{display:grid;gap:8px}
.in.sm{min-width:0;-webkit-appearance:none;appearance:none;min-height:44px;padding:8px 12px;font-size:16px;border-radius:12px}
.act.sm{padding:2px 4px 2px 12px;margin-bottom:6px;border-radius:12px}
.act.sm .n{font-size:14px;line-height:1.2}
.act.sm .icon-btn{width:40px;height:40px;font-size:18px}
.chk.sm{min-height:44px;padding:6px 12px;margin-top:8px;font-size:15px}
.newp{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:4px 4px 4px 12px;margin-top:6px}
.sugg-pop{position:absolute;left:0;right:0;top:46px;z-index:5}
.sugg-pop .sugg{margin-top:0;box-shadow:0 8px 24px rgba(20,40,60,.18)}
.cotline{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:48px;background:var(--green-soft);border:0;border-radius:14px;padding:8px 14px;margin-top:10px;font-size:14px;text-align:left;cursor:pointer;color:var(--ink)}
.cotline b{font-size:17px;white-space:nowrap}
.savebar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(rgba(238,245,250,0),var(--bg) 30%);z-index:9}
.savebar .btn{max-width:528px;margin:0 auto}
body.noTabs nav.tabs{display:none}
body.noTabs{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
@media print{
  body{background:#fff;padding:0}
  nav.tabs,.noprint,.toast{display:none!important}
  .print-only{display:block}
  .wrap{max-width:none;padding:0}
  .card,.tablewrap{border:1px solid #ccc}
  table.det{font-size:10.5px}
  table.det tr{break-inside:avoid}
}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><img src="logo-splash.png" alt=""></div>
<div id="app" class="wrap"></div>
<nav class="tabs noprint" id="tabs">
  <a href="#mois" data-tab="mois"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</a>
  <a href="#planning" data-tab="planning"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M7 14h4M7 17h7"/></svg>Planning</a>
  <a href="#patients" data-tab="patients"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Patients</a>
  <a href="#soins" data-tab="soins"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5"/></svg>Mes soins</a>
  <a href="#transmissions" data-tab="transmissions"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>Transmis.</a>
</nav>
<script src="engine.js"></script>
<script src="app.js"></script>
<script>setTimeout(function(){var s=document.getElementById('splash');if(s){s.classList.add('out');setTimeout(function(){s.remove()},400)}},window.SOEUR_SPLASH_MS||1000);</script>
</body>
</html>
